# Protect the release environment and version tags before enabling signing.
# PFX_BASE64 and PFX_PASSWORD belong to that environment, never to source or release assets.
name: Выпуск MSIX
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Существующий защищённый тег версии, например v1.5.0
        required: true
        type: string
      publish:
        description: Опубликовать после проверки (false создаёт черновик)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: flowvpn-release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_CLI_HOME: ${{ github.workspace }}/work/desktop-build/cli
  NUGET_PACKAGES: ${{ github.workspace }}/work/desktop-build/packages
  RestoreLockedMode: 'true'
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/FlowVPN.WinUI/packages.lock.json
      - name: Проверить тег, сертификат и адреса обновлений
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$'){throw 'Use an existing vMajor.Minor.Patch tag'}
          [xml]$project=Get-Content ./src/FlowVPN.WinUI/FlowVPN.WinUI.csproj -Raw
          $version=$project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if($env:RELEASE_TAG -ne "v$version"){throw 'Tag and project version disagree'}
          $commit=git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if($LASTEXITCODE -ne 0 -or $commit -ne (git rev-parse HEAD)){throw 'Checkout is not the selected version tag'}
          $publicPath=(Resolve-Path ./src/FlowVPN.WinUI/Assets/FlowVPN.cer).Path
          $certificate=[Security.Cryptography.X509Certificates.X509Certificate2]::new($publicPath)
          try {
            if($certificate.HasPrivateKey -or $certificate.Subject -like '*Development*'){throw 'Expected the public release certificate'}
            [xml]$manifest=Get-Content ./src/FlowVPN.WinUI/Package.appxmanifest -Raw
            if($manifest.Package.Identity.Version -ne "$version.0" -or $manifest.Package.Identity.Publisher -ne $certificate.Subject){throw 'Manifest version or publisher does not match the release'}
            $pin=(Get-FileHash $publicPath -Algorithm SHA256).Hash
            $launcher=Get-Content ./src/FlowVPN.WinUI/Distribution/Install-FlowVPN.cmd -Raw
            if(!$launcher.Contains("FLOWVPN_CERTIFICATE_SHA256=$pin")){throw 'Update the installer certificate pin when rotating the release certificate'}
          } finally {$certificate.Dispose()}
          $channels=Get-Content ./src/FlowVPN.WinUI/UpdateChannels.json -Raw | ConvertFrom-Json
          ($channels.Channels | Where-Object Id -eq stable).FeedUrl="https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/FlowVPN-stable.json"
          ($channels.Channels | Where-Object Id -eq preview).FeedUrl=''
          $channels | ConvertTo-Json -Depth 5 | Set-Content ./src/FlowVPN.WinUI/UpdateChannels.json -Encoding utf8NoBOM
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Проверить исходники и документацию
        shell: pwsh
        run: ./tools/Test-Repository.ps1
      - name: Восстановить закреплённые зависимости
        run: dotnet restore ./src/FlowVPN.WinUI/FlowVPN.WinUI.csproj --locked-mode
      - name: Подготовить закреплённый движок
        shell: pwsh
        run: ./src/FlowVPN.WinUI/Distribution/Get-PinnedCore.ps1 -Destination ./outputs/FlowVPN/core
      - name: Собрать рабочий MSIX и выполнить изолированные проверки
        shell: pwsh
        run: ./src/FlowVPN.WinUI/Build-MSIX.ps1 -Unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-unsigned-${{ inputs.tag }}
          path: |
            outputs/FlowVPN-MSIX/*-unsigned.msix
            outputs/FlowVPN-MSIX/*-tests.json
            outputs/FlowVPN-MSIX/*-checks.json
          if-no-files-found: error
          retention-days: 3

  sign-and-release:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msix-unsigned-${{ inputs.tag }}
          path: incoming
      - name: Подписать закреплённым ключом с временной меткой RFC 3161
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.FLOWVPN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)){throw 'Configure PFX_BASE64 and PFX_PASSWORD in the protected release environment'}
          $packages=@(Get-ChildItem ./incoming -File -Filter '*-unsigned.msix')
          if($packages.Count -ne 1){throw 'Expected one unsigned build artifact'}
          ./src/FlowVPN.WinUI/Distribution/Test-Msix.ps1 -PackagePath $packages[0].FullName -ExpectedMode Release -ExpectedVersion "$env:RELEASE_VERSION.0" -AllowUnsigned
          New-Item -ItemType Directory ./release -Force | Out-Null
          $package=Join-Path $PWD "release/FlowVPN-$env:RELEASE_VERSION-x64.msix"
          Copy-Item -LiteralPath $packages[0].FullName -Destination $package
          $publicPath=(Resolve-Path ./src/FlowVPN.WinUI/Assets/FlowVPN.cer).Path
          $expectedPin=(Get-FileHash $publicPath -Algorithm SHA256).Hash
          $pfx=Join-Path $env:RUNNER_TEMP ('flowvpn-signing-'+[guid]::NewGuid().ToString('N')+'.pfx')
          $privateCertificate=$null
          try {
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:PFX_BASE64))
            $privateCertificate=[Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx,$env:PFX_PASSWORD,[Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            $actualPin=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($privateCertificate.RawData))
            if(!$privateCertificate.HasPrivateKey -or $actualPin -ne $expectedPin){throw 'The private signing key does not match the checked-in public certificate'}
            $timestamp=if([string]::IsNullOrWhiteSpace($env:TIMESTAMP_URL)){'http://timestamp.digicert.com'}else{$env:TIMESTAMP_URL}
            $timestampUri=[uri]$timestamp
            if(!$timestampUri.IsAbsoluteUri -or $timestampUri.Scheme -notin @('http','https') -or $timestampUri.UserInfo -or $timestampUri.Fragment){throw 'Invalid RFC 3161 timestamp endpoint'}
            $sdkRoot=Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
            $signTool=Get-ChildItem -LiteralPath $sdkRoot -Filter signtool.exe -Recurse -File | Where-Object FullName -match '[\\/]x64[\\/]signtool\.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
            if(!$signTool){throw 'Windows SDK SignTool is missing'}
            & $signTool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr $timestamp /td SHA256 $package
            if($LASTEXITCODE -ne 0){throw 'MSIX signing or timestamping failed'}
          } finally {
            if($privateCertificate){$privateCertificate.Dispose()}
            if(Test-Path -LiteralPath $pfx){Remove-Item -LiteralPath $pfx -Force}
          }
      - name: Проверить пакет на временном runner и подготовить файлы выпуска
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=(Resolve-Path "./release/FlowVPN-$env:RELEASE_VERSION-x64.msix").Path
          $publicPath=(Resolve-Path ./src/FlowVPN.WinUI/Assets/FlowVPN.cer).Path
          $pin=(Get-FileHash $publicPath -Algorithm SHA256).Hash
          $certificate=[Security.Cryptography.X509Certificates.X509Certificate2]::new($publicPath)
          try {
            ./src/FlowVPN.WinUI/Distribution/Install-FlowVPN.ps1 -PackagePath $package -CertificatePath $publicPath -ExpectedCertificateSha256 $pin -ValidateOnly
            $trustedPath="Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)"
            if(!(Test-Path -LiteralPath $trustedPath)){
              "FLOWVPN_TEMPORARY_TRUST=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
              Import-Certificate -FilePath $publicPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            }
            $sdkRoot=Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
            $signTool=Get-ChildItem -LiteralPath $sdkRoot -Filter signtool.exe -Recurse -File | Where-Object FullName -match '[\\/]x64[\\/]signtool\.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
            if(!$signTool){throw 'Windows SDK signature verifier is missing'}
            & $signTool.FullName verify /pa /all /v $package
            if($LASTEXITCODE -ne 0){throw 'Windows package signature verification failed'}
            ./src/FlowVPN.WinUI/Distribution/New-GitHubReleaseFeed.ps1 -PackagePath $package -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -ExpectedPublisher $certificate.Subject -PublicCertificate $publicPath -OutputDirectory ./release
            Copy-Item -LiteralPath $publicPath -Destination ./release/FlowVPN.cer
            foreach($name in @('Install-FlowVPN.ps1','Install-FlowVPN.cmd','Test-PackagePayload.ps1')){
              Copy-Item -LiteralPath (Join-Path ./src/FlowVPN.WinUI/Distribution $name) -Destination (Join-Path ./release $name)
            }
            $kit=@($package,'./release/FlowVPN.cer','./release/Install-FlowVPN.ps1','./release/Install-FlowVPN.cmd','./release/Test-PackagePayload.ps1')
            Compress-Archive -LiteralPath $kit -DestinationPath "./release/FlowVPN-$env:RELEASE_VERSION-win-x64-setup.zip" -CompressionLevel Optimal
            $checksums=Get-ChildItem ./release -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash+'  '+$_.Name}
            $checksums | Set-Content ./release/SHA256SUMS.txt -Encoding utf8NoBOM
          } finally {$certificate.Dispose()}
      - name: Удалить временное доверие сертификату на runner
        if: ${{ always() }}
        shell: pwsh
        run: |
          if($env:FLOWVPN_TEMPORARY_TRUST -match '^[A-Fa-f0-9]{40}$'){
            $path="Cert:\LocalMachine\TrustedPeople\$env:FLOWVPN_TEMPORARY_TRUST"
            if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Force}
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-signed-${{ inputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Создать черновик GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $current=gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq .sha
          if($LASTEXITCODE -ne 0 -or $current -ne $env:RELEASE_COMMIT){throw 'Version tag changed during the build'}
          $assets=@(Get-ChildItem ./release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "FlowVPN $env:RELEASE_VERSION" --generate-notes @assets
          if($LASTEXITCODE -ne 0){throw 'Draft release creation failed; existing releases are not overwritten'}
      - name: Опубликовать проверенный выпуск
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
