name: Заголовок PR и сообщения коммитов
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Проверить правила сообщений
        run: python -m unittest discover -s tools -p test_commit_messages.py
      - name: Проверить заголовок PR и новые сообщения
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/check_commit_messages.py --base "$BASE_SHA" --head "$HEAD_SHA"
