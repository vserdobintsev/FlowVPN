name: Название pull request
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions: {}
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # No checkout, token, shell interpolation of the title, or external action.
      - name: Проверить Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: python
        run: |
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          pattern = r"(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([a-z0-9][a-z0-9._/-]*\))?!?: [A-Za-z0-9][\x20-\x7E]*"
          if len(title) > 120 or not re.fullmatch(pattern, title):
              print("::error::Название PR должно быть на английском по Conventional Commits, до 120 символов. Пример: fix(routing): preserve explicit domain rules")
              sys.exit(1)
          print("Название PR соответствует Conventional Commits.")
