name: Проверка сборки
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_CLI_HOME: ${{ github.workspace }}/work/desktop-build/cli
  NUGET_PACKAGES: ${{ github.workspace }}/work/desktop-build/packages
  RestoreLockedMode: 'true'
jobs:
  module:
    name: Outline transport
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: modules/outline-transport/go.mod
          cache: true
          cache-dependency-path: modules/outline-transport/go.sum
      - name: Проверить формат и закреплённые зависимости Go
        shell: pwsh
        working-directory: modules/outline-transport
        run: |
          $unformatted = & gofmt -l .
          if ($LASTEXITCODE -ne 0 -or $unformatted) { throw "Go formatting check failed: $unformatted" }
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'Go dependency download failed.' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Go module integrity check failed.' }
          git diff --exit-code -- go.mod go.sum
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Go dependency files changed.' }
      - name: Подготовить движок для локальной проверки совместимости
        shell: pwsh
        run: ./src/FlowVPN.WinUI/Distribution/Get-PinnedCore.ps1 -Destination ./outputs/FlowVPN/core
      - name: Проверить модуль и воспроизводимость сборки без TUN
        shell: pwsh
        run: |
          $core = (Resolve-Path ./outputs/FlowVPN/core/sing-box.exe).Path
          ./modules/outline-transport/Build.ps1 -OutputDirectory ./work/module-build-first -SingBoxPath $core
          ./modules/outline-transport/Build.ps1 -OutputDirectory ./work/module-build-second -SingBoxPath $core
          $first = Get-Content ./work/module-build-first/artifact.json -Raw | ConvertFrom-Json
          $second = Get-Content ./work/module-build-second/artifact.json -Raw | ConvertFrom-Json
          if ($first.Sha256 -cne $second.Sha256 -or $first.SizeBytes -ne $second.SizeBytes) {
              throw 'Module builds are not reproducible.'
          }
          $catalog = Get-Content ./src/FlowVPN.WinUI/modules.lock.json -Raw | ConvertFrom-Json
          $entry = @($catalog.Modules | Where-Object Id -eq $first.Id)
          if ($entry.Count -ne 1 -or $entry[0].Version -cne $first.Version -or
              $entry[0].Sha256 -ine $first.Sha256 -or $entry[0].SizeBytes -ne $first.SizeBytes) {
              throw 'The embedded module pin does not match the reproducible source build.'
          }
          git diff --exit-code -- modules/outline-transport/go.mod modules/outline-transport/go.sum
          if ($LASTEXITCODE -ne 0) { throw 'Tests or build changed pinned Go dependencies.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Outline-transport-verification
          path: work/module-build-first/
          if-no-files-found: error
          retention-days: 3
  verify:
    name: Build (${{ matrix.mode }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [Release, Preview]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/FlowVPN.WinUI/packages.lock.json
      - name: Проверить исходники и документацию
        shell: pwsh
        run: ./tools/Test-Repository.ps1
      - name: Восстановить закреплённые зависимости
        run: dotnet restore ./src/FlowVPN.WinUI/FlowVPN.WinUI.csproj --locked-mode
      - name: Подготовить закреплённый движок
        shell: pwsh
        run: ./src/FlowVPN.WinUI/Distribution/Get-PinnedCore.ps1 -Destination ./outputs/FlowVPN/core
      - name: Собрать и проверить MSIX без подключения VPN
        shell: pwsh
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          $options=@{Unsigned=$true}
          if($env:BUILD_MODE -eq 'Preview'){$options.Preview=$true}
          ./src/FlowVPN.WinUI/Build-MSIX.ps1 @options
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FlowVPN-${{ matrix.mode }}-verification
          path: |
            outputs/FlowVPN-MSIX/*-unsigned.msix
            outputs/FlowVPN-MSIX/*-tests.json
            outputs/FlowVPN-MSIX/*-checks.json
          if-no-files-found: error
          retention-days: 3
