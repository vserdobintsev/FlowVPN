name: Ошибка приложения
description: Сообщить о воспроизводимой ошибке FlowVPN.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Для уязвимостей используйте [непубличный канал](https://github.com/vserdobintsev/FlowVPN/blob/main/SECURITY.md).
        Не прикладывайте рабочие VPN-ключи, PFX, settings.dat, runtime.json, полные конфигурации и журналы. Для диагностики достаточно обезличенного примера.
  - type: input
    id: version
    attributes:
      label: Версия FlowVPN
      description: Точный номер из раздела «О приложении» или имя сборки.
      placeholder: Например, 1.4.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия и сборка Windows
      description: Можно посмотреть командой winver. Не прикладывайте имя пользователя или ключ продукта.
      placeholder: Например, Windows 11 24H2, сборка 26100.x, x64
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Способ запуска
      options:
        - MSIX
        - Сборка разработчика
        - Не знаю
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Источник подключения
      options:
        - Не связано с подключением
        - OpenVPN
        - Outline
        - Оба источника
        - Не знаю
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести
      description: Опишите минимальную последовательность действий и условия возникновения ошибки.
      placeholder: |
        1. Открыть…
        2. Выбрать…
        3. Нажать…
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Ожидаемый и фактический результат
      description: Что должно произойти и что происходит на самом деле? Если есть ошибка, приведите её точный текст без секретов.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Дополнительные сведения
      description: Необязательно. Короткий обезличенный фрагмент журнала или снимок экрана; укажите, повторяется ли проблема после перезапуска.
  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил похожие issues и удалил из сообщения ключи, пароли и личные данные.
          required: true
